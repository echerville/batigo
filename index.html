<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope · Une adresse, toutes les infos.</title>
<meta name="description" content="Scope, pour les professionnels du bâtiment et de l'immobilier : DPE, données du bâtiment, cadastre et cartes à partir d'une adresse.">
<meta name="theme-color" content="#F4F6FA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<script>
  // Version mobile ou PC : choix automatique, ou forcé par ?version=mobile|pc (mémorisé), ?version=auto pour revenir.
  (function () {
    var KEY = 'scope-version', p = new URLSearchParams(location.search).get('version');
    try { if (p === 'auto') localStorage.removeItem(KEY); else if (p === 'mobile' || p === 'pc') localStorage.setItem(KEY, p); } catch (e) {}
    var forced = null; try { forced = localStorage.getItem(KEY); } catch (e) {}
    var touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    window.SCOPE_MOBILE = forced ? forced === 'mobile' : (touchOnly || innerWidth <= 600);
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

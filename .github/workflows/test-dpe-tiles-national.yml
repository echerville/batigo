name: Test tuiles DPE multi-départements (mesure)

# Test uniquement : génère des tuiles pour quelques départements et mesure
# taille et temps. Ne committe rien ; le résultat est disponible en artefact.

on:
  workflow_dispatch:
    inputs:
      deps:
        description: 'Départements séparés par des espaces (ex. 44 75 13)'
        required: true
        default: '44 75 13'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      millesime: ${{ steps.mil.outputs.millesime }}
    steps:
      - id: m
        env:
          DEPS: ${{ inputs.deps }}
        run: |
          echo "matrix=$(python3 -c "import json,os,re; print(json.dumps([d for d in os.environ['DEPS'].split() if re.fullmatch(r'[0-9]{2}|2[AB]|97[1-6]', d)]))")" >> "$GITHUB_OUTPUT"
      - id: mil
        run: |
          MIL=$(curl -sf https://www.data.gouv.fr/api/1/datasets/base-de-donnees-nationale-des-batiments/ \
            | python3 -c "import sys,json,re; d=json.load(sys.stdin); ms=sorted({m for r in d.get('resources',[]) for m in re.findall(r'millesime_(\d{4}-\d{2}-[a-z])', r.get('url',''))}); print(ms[-1] if ms else '')")
          [ -z "$MIL" ] && MIL=2025-07-a
          echo "millesime=$MIL" >> "$GITHUB_OUTPUT"
          echo "Édition BDNB : $MIL"

  extract:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dep: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install pyproj shapely pandas --quiet
      - name: Télécharger la BDNB du département
        run: |
          MIL=${{ needs.prepare.outputs.millesime }}
          D=${{ matrix.dep }}
          URL="https://open-data.s3.fr-par.scw.cloud/bdnb_millesime_${MIL}/millesime_${MIL}_dep${D}/open_data_millesime_${MIL}_dep${D}_csv.zip"
          START=$(date +%s)
          wget -q "$URL" -O bdnb.zip
          echo "DL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          echo "ZIP_SIZE=$(du -m bdnb.zip | cut -f1)" >> "$GITHUB_ENV"
      - name: Extraire les bâtiments avec DPE
        run: |
          START=$(date +%s)
          python3 scripts/extract_dpe_44.py bdnb.zip dpe-${{ matrix.dep }}.geojson 2> extract.log
          tail -5 extract.log
          EXTRACT=$(( $(date +%s) - START ))
          NB=$(python3 -c "import json; print(len(json.load(open('dpe-${{ matrix.dep }}.geojson'))['features']))")
          GJ=$(du -m dpe-${{ matrix.dep }}.geojson | cut -f1)
          printf '{"dep":"%s","zip_mo":%s,"dl_s":%s,"extract_s":%s,"batiments":%s,"geojson_mo":%s}\n' \
            "${{ matrix.dep }}" "$ZIP_SIZE" "$DL_SECONDS" "$EXTRACT" "$NB" "$GJ" > stats-${{ matrix.dep }}.json
          cat stats-${{ matrix.dep }}.json
          df -h . | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: geojson-${{ matrix.dep }}
          path: |
            dpe-${{ matrix.dep }}.geojson
            stats-${{ matrix.dep }}.json
          retention-days: 3

  tiles:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Installer tippecanoe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev git
          git clone --depth=1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      - uses: actions/download-artifact@v4
        with:
          path: in
          merge-multiple: true
      - name: Tuiles par département et ensemble
        run: |
          mkdir -p out
          echo "| Dépt | ZIP BDNB (Mo) | Téléch. (s) | Extraction (s) | Bâtiments DPE | GeoJSON (Mo) | Tuiles (Mo) | Tippecanoe (s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for s in in/stats-*.json; do
            D=$(python3 -c "import json; print(json.load(open('$s'))['dep'])")
            START=$(date +%s)
            tippecanoe -q -o out/dpe-$D.pmtiles --minimum-zoom=12 --maximum-zoom=18 --layer=dpe \
              --simplification=4 --drop-densest-as-needed --force in/dpe-$D.geojson
            T=$(( $(date +%s) - START ))
            KB=$(du -k out/dpe-$D.pmtiles | cut -f1)
            python3 -c "import json; s=json.load(open('$s')); print(f\"| {s['dep']} | {s['zip_mo']} | {s['dl_s']} | {s['extract_s']} | {s['batiments']} | {s['geojson_mo']} | {$KB/1024:.1f} | $T |\")" >> "$GITHUB_STEP_SUMMARY"
          done
          START=$(date +%s)
          tippecanoe -q -o out/dpe-ensemble.pmtiles --minimum-zoom=12 --maximum-zoom=18 --layer=dpe \
            --simplification=4 --drop-densest-as-needed --force in/dpe-*.geojson
          T=$(( $(date +%s) - START ))
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fichier unique pour tous les départements testés : $(du -m out/dpe-ensemble.pmtiles | cut -f1) Mo, $T s" >> "$GITHUB_STEP_SUMMARY"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pmtiles-test
          path: out/
          retention-days: 3

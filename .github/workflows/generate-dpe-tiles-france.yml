name: Generate DPE PMTiles France (R2)

# Génère les tuiles DPE de chaque département (BDNB, dernière édition),
# les fusionne en un fichier national et le dépose sur Cloudflare R2.
# Secrets requis : R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
    inputs:
      deps:
        description: 'Départements (vide = France métropolitaine entière)'
        required: false
        default: ''

env:
  R2_BUCKET: scope-tuiles-eu

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      millesime: ${{ steps.mil.outputs.millesime }}
    steps:
      - id: mil
        run: |
          MIL=$(curl -sf https://www.data.gouv.fr/api/1/datasets/base-de-donnees-nationale-des-batiments/ \
            | python3 -c "import sys,json,re; d=json.load(sys.stdin); ms=sorted({m for r in d.get('resources',[]) for m in re.findall(r'millesime_(\d{4}-\d{2}-[a-z])', r.get('url',''))}); print(ms[-1] if ms else '')")
          [ -z "$MIL" ] && { echo "::error::Édition BDNB introuvable"; exit 1; }
          echo "millesime=$MIL" >> "$GITHUB_OUTPUT"
          echo "Édition BDNB : $MIL"
      - id: m
        env:
          DEPS: ${{ inputs.deps }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          deps = [d for d in os.environ.get('DEPS', '').split() if re.fullmatch(r'[0-9]{2}|2[AB]', d)]
          if not deps:
              deps = [f'{i:02d}' for i in range(1, 96) if i != 20] + ['2A', '2B']
          print('matrix=' + json.dumps(deps))
          PY

  departement:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dep: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          pip3 install pyproj shapely pandas --quiet
          sudo apt-get update -q && sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth=1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      - name: BDNB → GeoJSON → tuiles du département
        run: |
          MIL=${{ needs.prepare.outputs.millesime }}
          D=${{ matrix.dep }}
          URL="https://open-data.s3.fr-par.scw.cloud/bdnb_millesime_${MIL}/millesime_${MIL}_dep${D}/open_data_millesime_${MIL}_dep${D}_csv.zip"
          wget -q "$URL" -O bdnb.zip
          python3 scripts/extract_dpe_44.py bdnb.zip dpe.geojson 2> extract.log; tail -3 extract.log
          rm bdnb.zip
          mkdir -p out
          tippecanoe -q -o out/dpe-$D.mbtiles --minimum-zoom=12 --maximum-zoom=18 --layer=dpe \
            --simplification=4 --drop-densest-as-needed --force dpe.geojson
          du -h out/dpe-$D.mbtiles
      - uses: actions/upload-artifact@v4
        with:
          name: mbtiles-${{ matrix.dep }}
          path: out/
          retention-days: 2

  fusion:
    needs: [prepare, departement]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Installer tippecanoe
        run: |
          sudo apt-get update -q && sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth=1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      - uses: actions/download-artifact@v4
        with:
          path: in
          pattern: mbtiles-*
          merge-multiple: true
      - name: Fusion nationale
        run: |
          ls in | wc -l
          NOM="dpe-france-${{ needs.prepare.outputs.millesime }}-$(date +%Y%m%d-%H%M).pmtiles"
          echo "NOM=$NOM" >> "$GITHUB_ENV"
          tile-join -o "$NOM" --no-tile-size-limit --force in/*.mbtiles
          du -h "$NOM"
          printf '{"millesime":"%s","genere_le":"%s","fichier":"%s","departements":%s}\n' \
            "${{ needs.prepare.outputs.millesime }}" "$(date +%Y-%m-%d)" "$NOM" "$(ls in | wc -l)" > dpe-france-meta.json
          cat dpe-france-meta.json
      - name: Dépôt sur Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          EP="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # Fichier versionné (jamais écrasé), puis le petit fichier qui pointe dessus
          aws s3 cp "$NOM" "s3://$R2_BUCKET/$NOM" --endpoint-url "$EP" \
            --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dpe-france-meta.json "s3://$R2_BUCKET/dpe-france-meta.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "no-cache"
          # Garder seulement les 2 dernières versions
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$EP" | awk '{print $4}' | grep '^dpe-france-.*\.pmtiles$' \
            | sort | head -n -2 | while read f; do aws s3 rm "s3://$R2_BUCKET/$f" --endpoint-url "$EP"; done
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$EP"

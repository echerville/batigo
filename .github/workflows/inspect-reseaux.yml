name: Inspection sources réseaux (temporaire)
on:
  push:
    branches: [etape4-rcu-gaz]
    paths: ['.github/workflows/inspect-reseaux.yml']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y gdal-bin >/dev/null
      - name: FCU
        run: |
          curl -s "https://www.data.gouv.fr/api/1/datasets/64f05d3568e4d575eb454ffe/" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for r in sorted(d['resources'], key=lambda r: r.get('last_modified',''), reverse=True)[:4]:
              print(r['last_modified'], r['format'], r.get('filesize'), r['title'], r['url'])"
          URL=$(curl -s "https://www.data.gouv.fr/api/1/datasets/64f05d3568e4d575eb454ffe/" | python3 -c "
          import sys,json; d=json.load(sys.stdin); rs=[r for r in d['resources'] if r['format'] in ('zip',)]
          print(sorted(rs,key=lambda r:r.get('last_modified',''))[-1]['url'])")
          echo "URL=$URL"; curl -sL "$URL" -o fcu.zip; ls -la fcu.zip; unzip -l fcu.zip
          mkdir fcu && cd fcu && unzip -q ../fcu.zip
          for f in $(find . -name '*.gpkg' -o -name '*.geojson' -o -name '*.shp' -o -name '*.json'); do echo "=== $f"; ogrinfo -so -al "$f" 2>&1 | grep -vE '^\s*$' | head -80; done
      - name: GRDF
        run: |
          B=https://opendata.grdf.fr/api/explore/v2.1/catalog/datasets/cartographie-du-reseau-grdf-en-service
          curl -s "$B" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ['dataset_id','has_records']},ensure_ascii=False)); print(json.dumps(d.get('metas',{}).get('default',{}),ensure_ascii=False)[:1500]); print([ (f['name'],f['type']) for f in d.get('fields',[])])"
          curl -s "$B/records?limit=2" | head -c 1500; echo
          curl -s "$B/exports" | head -c 1500; echo
          curl -sI "$B/exports/geojson" | head -15
          curl -s "https://www.data.gouv.fr/api/1/datasets/cartographie-du-reseau-grdf-en-service/" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for r in d['resources']: print(r['last_modified'], r['format'], r.get('filesize'), r['title'], r['url'])"
